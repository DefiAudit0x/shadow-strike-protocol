vulnerability_class: cross_contract
display_name: "Cross-Contract / Composability Hazards"
description: >
  The vulnerability doesn't live in any single contract in isolation —
  it emerges from how two or more contracts interact (e.g. contract A
  trusts a callback from contract B that B's own logic lets an attacker
  redirect; a shared library used inconsistently by two contracts that
  disagree about an invariant each assumes the other enforces).

default_invariants: []
# genuinely scenario-specific — a cross-contract invariant is, by
# definition, a statement about the RELATIONSHIP between two particular
# contracts, not something generic enough to default here.

default_success_conditions: []

heuristic_source_patterns:
  - pattern: '.staticcall('
    note: "external state read — review trust in the target and returned data"
  - pattern: '.delegatecall('
    note: "delegated execution — review who controls the implementation"
  - pattern: 'onERC721Received('
    note: "receiver callback — review cross-contract state assumptions"

# roadmap — this class is defined by the RELATIONSHIP between specific
# contracts in a specific deployment; see architecture doc §8, "attacks
# that need bespoke per-protocol logic." Composes with whatever
# single-contract class actually triggers the exploit once scoped.
