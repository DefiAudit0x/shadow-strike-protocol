vulnerability_class: flash_loan
display_name: "Flash-Loan-Amplified Attack"
description: >
  Any of the above (oracle manipulation, accounting, economic attacks)
  becomes exploitable at scale because the attacker can borrow enormous
  capital atomically within a single transaction, with no collateral
  requirement beyond repayment-in-the-same-tx. Shadow Strike models this
  as a capability any other scenario can request, not a standalone
  vulnerability class — see composes_with below.

default_invariants: []

default_success_conditions:
  - expression: "attacker.eth_balance_after - attacker.eth_balance_before > 0"
    description: "Attacker ended with more ETH than they started with"

heuristic_source_patterns:
  - pattern: 'onFlashLoan'
    note: "flash-loan callback present — check what state the protocol trusts mid-callback"
  - pattern: 'flashLoan('
    note: "flash-loan entry point — check for reentrancy guards covering this path specifically"

attacker_template: attacker_template.sol.j2
composes_with: [oracle_manipulation, accounting, economic]
