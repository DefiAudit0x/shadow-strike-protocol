name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies (zero-dep engine)
        run: pip install -e .

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Run the live end-to-end demo (mock engine)
        run: python examples/run_demo.py

      - name: Sandbox self-test (OS-level rlimits)
        run: python shadow_strike/execution/sandbox.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check shadow_strike/ --line-length 110
        continue-on-error: true   # advisory only until the codebase is ruff-clean

  foundry-tests:
    runs-on: ubuntu-latest
    # Runs the hand-written reference Foundry tests (contracts/test/VaultReentrancy.t.sol)
    # against LOCAL deployments — no fork/RPC secret needed for this job, which is why
    # it's safe to run on every PR including ones from forks.
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit
      - name: Run local (non-fork) Foundry tests
        run: forge test --match-contract VaultReentrancyTest -vvv

  production-import-check:
    runs-on: ubuntu-latest
    # Confirms the optional production modules (LLM adapter, Postgres
    # store, FastAPI layer) are at least syntactically/importably sound,
    # without requiring real credentials or a live Postgres/RPC.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production extras
        run: pip install -e ".[production]"
      - name: Import every production module
        run: |
          python -c "import shadow_strike.agent.llm_providers"
          python -c "import shadow_strike.storage.postgres_store"
          python -c "import shadow_strike.api.main" || echo "api.main needs a live import context — syntax-checked only"
          python -c "import shadow_strike.agent.graph_langgraph"
